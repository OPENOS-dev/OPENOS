name: 自定义 ISO 构建请求
description: 提交自定义 OPENOS ISO 镜像构建请求，系统将自动构建并提供下载链接
title: "[ISO-BUILD] "
labels: [custom-iso-build]
body:
  - type: markdown
    attributes:
      value: |
        ## OPENOS 自定义 ISO 构建

        提交此表单后，系统将自动构建您指定的 OPENOS ISO 镜像，
        构建完成后您将在此 Issue 中收到下载链接及过期时间。

  - type: input
    id: iso-name
    attributes:
      label: 镜像名称
      description: 为此构建版本取一个简短的标识名称（仅允许字母、数字、连字符）
      placeholder: "my-custom-build"
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: 目标架构
      description: 选择构建目标架构
      options:
        - x86-64
        - x86
        - arm64
        - arm32
        - loong64
    validations:
      required: true

  - type: dropdown
    id: kernel
    attributes:
      label: 内核分层
      description: 选择内核版本
      options:
        - base (Linux 6.12 LTS)
        - base7 (Linux 7.1)
        - preview (Linux 7.2-rc)
        - classic (Linux 5.15 LTS)
    validations:
      required: true

  - type: textarea
    id: pacman-packages
    attributes:
      label: 额外 Pacman 包列表（可选）
      description: 需要从 OPENOS 仓库安装的额外软件包，每行一个。系统会自动处理依赖关系。
      placeholder: |
        neofetch
        htop
        git
        vim
    validations:
      required: false

  - type: input
    id: expire-days
    attributes:
      label: 下载过期时间（天）
      description: 镜像下载链接的有效天数，超过此期限后链接将自动失效（默认 30 天，最长 90 天）
      placeholder: "30"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 构建备注（可选）
      description: 任何其他说明或备注
      placeholder: "例如：用于测试某某功能..."
    validations:
      required: false