name: OPENOS Custom ISO Build

# 用户通过 Issue 模板提交自定义 ISO 构建请求后，此工作流自动执行。
# 构建产物以 Actions Artifact 形式保存，仅仓库成员可访问下载，
# 超过过期时间后 Artifact 自动过期清除。

on:
  issues:
    types: [opened, labeled]

jobs:
  validate-and-build:
    # 仅当 Issue 带有 custom-iso-build 标签且标题以 [ISO-BUILD] 开头时执行
    if: |
      contains(github.event.issue.labels.*.name, 'custom-iso-build') &&
      startsWith(github.event.issue.title, '[ISO-BUILD]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      issues: write         # 回复/操作 Issue 需要

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}

    outputs:
      iso_name: ${{ steps.parse.outputs.iso_name }}
      arch: ${{ steps.parse.outputs.arch }}
      kernel: ${{ steps.parse.outputs.kernel }}
      expire_date: ${{ steps.parse.outputs.expire_date }}
      expire_days: ${{ steps.parse.outputs.expire_days }}
      build_id: ${{ steps.parse.outputs.build_id }}
      iso_file: ${{ steps.parse.outputs.iso_file }}

    steps:
      - name: 添加构建中标签
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --add-label "building-iso" || true

      - name: 解析 Issue 体提取构建参数
        id: parse
        run: |
          # 将 Issue body 写入文件（避免 shell 转义问题）
          echo 'BODY_START' > /tmp/issue-body.txt
          cat << 'BODYEOF' >> /tmp/issue-body.txt
          ${{ toJSON(github.event.issue.body) }}
          BODYEOF
          echo 'BODY_END' >> /tmp/issue-body.txt

          # 提取实际 body 内容（去除前后标记行和 JSON 引号）
          python3 <<'PYEOF'
          import re, hashlib, json, os

          with open('/tmp/issue-body.txt') as f:
              text = f.read()

          # 提取 BODY_START 和 BODY_END 之间的内容
          m = re.search(r'BODY_START\s*\n(.*)\n\s*BODY_END', text, re.DOTALL)
          body_raw = m.group(1).strip() if m else ''

          # 去除 JSON 引号（toJSON 输出带引号）
          if body_raw.startswith('"') and body_raw.endswith('"'):
              body_raw = body_raw[1:-1]
          # 转义还原
          body = body_raw.replace('\\n', '\n').replace('\\t', '\t').replace('\\"', '"')

          def get_field(pattern, text, default=''):
              m = re.search(pattern, text, re.MULTILINE | re.DOTALL)
              return m.group(1).strip() if m else default

          iso_name  = get_field(r'### 镜像名称\s*\n\s*([^\n]+)', body, 'custom')
          arch      = get_field(r'### 目标架构\s*\n\s*([^\n]+)', body, 'x86-64')
          kernel    = get_field(r'### 内核分层\s*\n\s*([^\n]+)', body, 'base')
          comp_set  = get_field(r'### 组件集合\s*\n\s*([^\n]+)', body, 'full')
          custom_comp = get_field(r'### 自定义组件列表\s*\n\s*([^#]*)', body, '')
          expire_days = get_field(r'### 下载过期时间[（(]天[）)]\s*\n\s*([^\n]+)', body, '30')

          # 清理
          iso_name = re.sub(r'[^a-zA-Z0-9_-]', '_', iso_name)[:40]
          expire_days = re.sub(r'[^0-9]', '', expire_days)
          if not expire_days or int(expire_days) <= 0:
              expire_days = '30'
          if int(expire_days) > 90:
              expire_days = '90'

          # 内核分层提取 (取第一个单词)
          kernel_key = kernel.split()[0].lower()

          # 组件集合
          comp_map = {
              'full': 'kernel glibc bash coreutils util-linux pacman systemd gcc apt liboak libopenrsa libvmapp oakctl openos-oak-seal openos-uname openos-securityd openos-settingsd openos-settings openos-calendar openos-welcome openos-run openos-oak opt OPENUI-desktop linux',
              'minimal': 'kernel glibc bash coreutils',
              'desktop': 'kernel glibc bash coreutils util-linux pacman systemd apt liboak libopenrsa oakctl openos-uname openos-securityd openos-settingsd openos-settings openos-calendar openos-welcome openos-run openos-oak opt OPENUI-desktop linux',
          }

          if comp_set.strip() == 'custom':
              comp_list = [c.strip() for c in custom_comp.strip().split('\n') if c.strip()]
              components = ' '.join(comp_list) if comp_list else 'kernel glibc bash coreutils'
          else:
              components = comp_map.get(comp_set.strip().lower(), comp_map['full'])

          # 构建 ID = 名称 + 日期 + 哈希
          raw = f"{iso_name}-{arch}-{kernel_key}-{os.environ.get('ISSUE_NUMBER', '0')}"
          build_id = hashlib.sha256(raw.encode()).hexdigest()[:12]

          # 过期日期
          from datetime import datetime, timedelta
          expire = (datetime.utcnow() + timedelta(days=int(expire_days))).strftime('%Y-%m-%d')

          # ISO 文件名
          iso_file = f"openos-{iso_name}-{arch}-{kernel_key}-{build_id}.iso"

          # 写入 GITHUB_OUTPUT
          with open(os.environ.get('GITHUB_OUTPUT', ''), 'a') as f:
              f.write(f"iso_name={iso_name}\n")
              f.write(f"arch={arch}\n")
              f.write(f"kernel={kernel_key}\n")
              f.write(f"expire_date={expire}\n")
              f.write(f"expire_days={expire_days}\n")
              f.write(f"build_id={build_id}\n")
              f.write(f"iso_file={iso_file}\n")
              f.write(f"components={components}\n")
          PYEOF
        env:
          BODY: ${{ github.event.issue.body }}

      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            zstd xorriso isolinux grub-pc-bin grub-common \
            mtools squashfs-tools

      - name: 拉取各组件最新 binpkg
        run: |
          cd OPENOS_CORE/BUILD_SYSTEM
          chmod +x fetch_binpkgs.sh build_image.sh
          ./fetch_binpkgs.sh --arch=${{ steps.parse.outputs.arch }} --kernel=${{ steps.parse.outputs.kernel }}

      - name: 组装 rootfs
        run: |
          cd OPENOS_CORE/BUILD_SYSTEM
          ./build_image.sh --arch=${{ steps.parse.outputs.arch }} \
            --kernel=${{ steps.parse.outputs.kernel }} \
            --out=${{ steps.parse.outputs.build_id }}

      - name: 构建可启动 ISO
        run: |
          ARCH=${{ steps.parse.outputs.arch }}
          KERNEL=${{ steps.parse.outputs.kernel }}
          BUILD_ID=${{ steps.parse.outputs.build_id }}
          ISO_FILE=${{ steps.parse.outputs.iso_file }}
          IMAGE_DIR="OPENOS_CORE/BUILD_SYSTEM/out/images"
          STAGE="$RUNNER_TEMP/iso-stage"
          ROOTFS_ARCHIVE="$IMAGE_DIR/${ARCH}-${KERNEL}-${BUILD_ID}.tar.zst"

          mkdir -p "$STAGE/iso-root" "$STAGE/iso-out"

          # 解压 rootfs
          tar --zstd -xf "$ROOTFS_ARCHIVE" -C "$STAGE/iso-root"

          # 创建 squashfs 压缩根文件系统
          sudo mksquashfs "$STAGE/iso-root" "$STAGE/iso-out/filesystem.squashfs" \
            -comp zstd -b 1M -no-exports -no-recovery

          # 创建 ISO 目录结构
          ISO_DIR="$STAGE/iso-dir"
          mkdir -p "$ISO_DIR/boot/grub" "$ISO_DIR/live"

          # 复制内核和 initrd (从 rootfs 中提取)
          cp "$STAGE/iso-root/boot/vmlinuz"* "$ISO_DIR/boot/vmlinuz" 2>/dev/null || true
          cp "$STAGE/iso-root/boot/initrd"* "$ISO_DIR/boot/initrd" 2>/dev/null || true

          # 移动 squashfs 到 live 目录
          mv "$STAGE/iso-out/filesystem.squashfs" "$ISO_DIR/live/"

          # GRUB 配置
          cat > "$ISO_DIR/boot/grub/grub.cfg" <<'GRUBEOF'
set timeout=5
set default=0

menuentry "OPENOS Live (x86-64)" {
  linux /boot/vmlinuz boot=live toram findiso=/live/filesystem.squashfs quiet splash
  initrd /boot/initrd
}
GRUBEOF

          # 生成 ISO (使用 grub-mkrescue)
          sudo grub-mkrescue -o "$IMAGE_DIR/$ISO_FILE" "$ISO_DIR" 2>/dev/null || \
          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "OPENOS_LIVE" \
            -eltorito-boot boot/grub/grub.cfg \
            -no-emul-boot \
            -boot-load-size 4 \
            -boot-info-table \
            -eltorito-catalog boot/grub/boot.cat \
            -output "$IMAGE_DIR/$ISO_FILE" \
            "$ISO_DIR"

          ls -lah "$IMAGE_DIR/$ISO_FILE"
          echo "ISO 构建完成: $IMAGE_DIR/$ISO_FILE"

      - name: 上传 ISO 到临时文件托管（生成公开下载链接）
        id: upload
        run: |
          ARCH=${{ steps.parse.outputs.arch }}
          ISO_FILE=${{ steps.parse.outputs.iso_file }}
          EXPIRE_DAYS=${{ steps.parse.outputs.expire_days }}
          IMAGE_DIR="OPENOS_CORE/BUILD_SYSTEM/out/images"
          ISO_PATH="$IMAGE_DIR/$ISO_FILE"
          ISO_SIZE=$(stat -f%z "$ISO_PATH" 2>/dev/null || stat -c%s "$ISO_PATH" 2>/dev/null)

          echo "ISO 文件大小: $(numfmt --to=iec $ISO_SIZE 2>/dev/null || echo "${ISO_SIZE} bytes")"

          DOWNLOAD_URL=""
          # 尝试多个临时文件托管服务，直到成功
          echo "尝试上传到 transfer.sh (最大 14天) ..."
          URL=$(curl -s --max-time 300 --upload-file "$ISO_PATH" \
            "https://transfer.sh/${ISO_FILE}" 2>/dev/null) && [ -n "$URL" ] && \
            DOWNLOAD_URL="$URL" && echo "transfer.sh 成功: $URL"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "尝试上传到 temp.sh ..."
            URL=$(curl -s --max-time 300 --upload-file "$ISO_PATH" \
              "https://temp.sh/upload" 2>/dev/null | grep -oP 'https?://[^"<>]+' | head -1) && \
              [ -n "$URL" ] && DOWNLOAD_URL="$URL" && echo "temp.sh 成功: $URL"
          fi

          if [ -z "$DOWNLOAD_URL" ]; then
            # 上传失败，回退到说明 Actions Artifact 方式
            echo "所有临时文件托管服务上传失败，将使用 Actions Artifact"
            echo "upload_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload_failed=false" >> "$GITHUB_OUTPUT"
            echo "download_url=${DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传 ISO 到 Actions Artifact（备选）
        if: steps.upload.outputs.upload_failed == 'true' || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.parse.outputs.iso_file }}
          path: OPENOS_CORE/BUILD_SYSTEM/out/images/${{ steps.parse.outputs.iso_file }}
          retention-days: ${{ steps.parse.outputs.expire_days }}
          if-no-files-found: error

      - name: 在 Issue 中回复构建结果
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCH=${{ steps.parse.outputs.arch }}
          KERNEL=${{ steps.parse.outputs.kernel }}
          BUILD_ID=${{ steps.parse.outputs.build_id }}
          ISO_NAME=${{ steps.parse.outputs.iso_name }}
          EXPIRE_DATE=${{ steps.parse.outputs.expire_date }}
          EXPIRE_DAYS=${{ steps.parse.outputs.expire_days }}
          ISO_FILE=${{ steps.parse.outputs.iso_file }}
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          DL_URL="${{ steps.upload.outputs.download_url }}"

          if [ -n "$DL_URL" ]; then
            # 有公开下载链接
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "## OPENOS ISO 构建完成

| 项目 | 值 |
|------|-----|
| 镜像名称 | ${ISO_NAME} |
| 架构 | ${ARCH} |
| 内核 | ${KERNEL} |
| 构建 ID | ${BUILD_ID} |
| 过期日期 | ${EXPIRE_DATE} |

**下载链接**: [${ISO_FILE}](${DL_URL})

> 此链接将在 ${EXPIRE_DAYS} 天后（${EXPIRE_DATE}）自动失效。
> 如需重新构建，请提交新的 Issue。"
          else
            # 无公开链接，使用 Artifact
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "## OPENOS ISO 构建完成

| 项目 | 值 |
|------|-----|
| 镜像名称 | ${ISO_NAME} |
| 架构 | ${ARCH} |
| 内核 | ${KERNEL} |
| 构建 ID | ${BUILD_ID} |
| 过期日期 | ${EXPIRE_DATE} |

**镜像已保存至 Actions 构建产物**，需登录 GitHub 后下载。

下载方式：
1. 打开此构建的运行页面：[${GITHUB_RUN_ID}](${RUN_URL})
2. 在页面底部的 **Artifacts** 区域找到 \`${ISO_FILE}\`
3. 点击即可下载

> 此产物将在 ${EXPIRE_DAYS} 天后（${EXPIRE_DATE}）自动过期清除。
> 如需重新构建，请提交新的 Issue。"
          fi

          # 移除构建中标签，添加构建完成标签
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label "building-iso" \
            --add-label "iso-built" || true

      - name: 构建失败时通知并创建失败追踪 Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCH=${{ steps.parse.outputs.arch }}
          KERNEL=${{ steps.parse.outputs.kernel }}
          BUILD_ID=${{ steps.parse.outputs.build_id }}
          ISO_NAME=${{ steps.parse.outputs.iso_name }}

          # 1. 在原 Issue 中回复失败信息
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "## 构建失败

很抱歉，ISO 构建过程中出现错误。请检查构建日志了解更多信息。

[查看构建日志](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

可能的原因：
- 某个组件当前不可用（binpkg 缺失）
- 构建环境依赖问题
- 请求的参数不合法

请修正后重新提交 Issue。" || true

          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label "building-iso" \
            --add-label "iso-failed" || true

          # 2. 创建新的失败追踪 Issue
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[ISO-BUILD-FAIL] ${ISO_NAME} (${ARCH}/${KERNEL})" \
            --label "iso-failure" \
            --label "bug" \
            --body "## ISO 构建失败报告

此 Issue 由自定义 ISO 构建流水线自动创建，用于追踪构建失败原因。

| 项目 | 值 |
|------|-----|
| 镜像名称 | ${ISO_NAME} |
| 架构 | ${ARCH} |
| 内核 | ${KERNEL} |
| 构建 ID | ${BUILD_ID} |
| 源 Issue | [#${ISSUE_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}) |
| 构建日志 | [查看](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |

### 失败原因

请维护者检查构建日志，确定失败原因并修复。

### 用户操作

用户可以修正参数后重新提交 [新的 ISO 构建请求](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/new?template=custom-iso-build.yml)。" || true