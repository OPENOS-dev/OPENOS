name: 功能请求 / Feature Request
description: 提交新功能或改进建议 / Submit a new feature or improvement suggestion
title: "[FEATURE] "
labels: [feature-request]
body:
  - type: markdown
    attributes:
      value: |
        ## 功能请求 / Feature Request

        **中文：** 感谢您为 OPENOS 提出改进建议！请详细描述您希望的功能。

        **English:** Thank you for suggesting an improvement to OPENOS! Please describe the feature you'd like in detail.

  - type: input
    id: component
    attributes:
      label: 相关组件 / Related Component
      description: 该功能涉及哪个组件？（如内核、桌面环境、某个 App、构建系统等） / Which component does this feature relate to? (e.g., kernel, desktop, app, build system)
      placeholder: "openos-terminal / OPENUI-desktop / 构建系统 / Build System"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 解决的问题 / Problem Solved
      description: 描述您遇到什么问题或当前缺少什么功能，为什么需要这个功能 / Describe the problem or missing functionality, and why this feature is needed
      placeholder: "当...时，我希望能...，因为... / When..., I wish..., because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed Solution
      description: 描述您期望的功能表现或实现方式，越详细越好 / Describe the expected behavior or implementation in as much detail as possible
      placeholder: "我希望新增一个功能，能够... / I would like a new feature that..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选） / Alternatives (Optional)
      description: 有没有其他方式可以解决您的问题？ / Are there alternative ways to solve your problem?
      placeholder: "我尝试过...，但... / I tried..., but..."

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围 / Scope of Impact
      description: 该功能的影响范围 / The scope of this feature's impact
      options:
        - 组件内部（仅影响单个 App/模块） / Component-level (single app/module)
        - 跨组件（涉及多个模块交互） / Cross-component (multiple modules)
        - 系统级（影响整个系统架构） / System-level (entire system architecture)
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息（可选） / Additional Info (Optional)
      description: 截图、参考实现、文档链接等 / Screenshots, reference implementations, documentation links, etc.
      placeholder: "可以参考 XXX 项目的实现方式... / Reference implementation from XXX project..."