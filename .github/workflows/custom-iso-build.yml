name: OPENOS Custom ISO Build

# 用户通过 Issue 模板提交自定义 ISO 构建请求后，此工作流自动执行。
# 构建产物推送到共享 binpkg 仓库 (OPENOS-BUILD-BINPKG)，
# 提供原始文件下载链接，过期后由 iso-cleanup 工作流自动删除。

on:
  issues:
    types: [opened, labeled]

jobs:
  validate-and-build:
    # 仅当 Issue 带有 custom-iso-build 标签且标题以 [ISO-BUILD] 开头时执行
    if: |
      contains(github.event.issue.labels.*.name, 'custom-iso-build') &&
      startsWith(github.event.issue.title, '[ISO-BUILD]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      issues: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      BINPKG_REPO: OPENOS-dev/OPENOS-BUILD-BINPKG

    outputs:
      iso_name: ${{ steps.parse.outputs.iso_name }}
      arch: ${{ steps.parse.outputs.arch }}
      kernel: ${{ steps.parse.outputs.kernel }}
      expire_date: ${{ steps.parse.outputs.expire_date }}
      expire_days: ${{ steps.parse.outputs.expire_days }}
      build_id: ${{ steps.parse.outputs.build_id }}
      iso_file: ${{ steps.parse.outputs.iso_file }}
      iso_dir: ${{ steps.parse.outputs.iso_dir }}

    steps:
      - name: 添加构建中标签
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --add-label "building-iso" || true

      - name: 解析 Issue 体提取构建参数
        id: parse
        run: |
          echo 'BODY_START' > /tmp/issue-body.txt
          cat << 'BODYEOF' >> /tmp/issue-body.txt
          ${{ toJSON(github.event.issue.body) }}
          BODYEOF
          echo 'BODY_END' >> /tmp/issue-body.txt

          python3 <<'PYEOF'
          import re, hashlib, json, os

          with open('/tmp/issue-body.txt') as f:
              text = f.read()
          m = re.search(r'BODY_START\s*\n(.*)\n\s*BODY_END', text, re.DOTALL)
          body_raw = m.group(1).strip() if m else ''
          if body_raw.startswith('"') and body_raw.endswith('"'):
              body_raw = body_raw[1:-1]
          body = body_raw.replace('\\n', '\n').replace('\\t', '\t').replace('\\"', '"')

          def get_field(pattern, text, default=''):
              m = re.search(pattern, text, re.MULTILINE | re.DOTALL)
              return m.group(1).strip() if m else default

          iso_name  = get_field(r'### 镜像名称\s*\n\s*([^\n]+)', body, 'custom')
          arch      = get_field(r'### 目标架构\s*\n\s*([^\n]+)', body, 'x86-64')
          kernel    = get_field(r'### 内核分层\s*\n\s*([^\n]+)', body, 'base')
          pkgs_raw  = get_field(r'### 额外 Pacman 包列表[（(]可选[）)]\s*\n\s*([^#]*)', body, '')
          expire_days = get_field(r'### 下载过期时间[（(]天[）)]\s*\n\s*([^\n]+)', body, '30')

          iso_name = re.sub(r'[^a-zA-Z0-9_-]', '_', iso_name)[:40]
          expire_days = re.sub(r'[^0-9]', '', expire_days)
          if not expire_days or int(expire_days) <= 0: expire_days = '30'
          if int(expire_days) > 90: expire_days = '90'

          kernel_key = kernel.split()[0].lower()

          # 解析 Pacman 包列表
          pacman_pkgs = []
          if pkgs_raw.strip():
              for line in pkgs_raw.strip().split('\n'):
                  pkg = line.strip()
                  if pkg and not pkg.startswith('#'):
                      pacman_pkgs.append(pkg)

          raw = f"{iso_name}-{arch}-{kernel_key}-{os.environ.get('ISSUE_NUMBER', '0')}"
          build_id = hashlib.sha256(raw.encode()).hexdigest()[:12]

          from datetime import datetime, timedelta
          expire = (datetime.utcnow() + timedelta(days=int(expire_days))).strftime('%Y-%m-%d')

          iso_file = f"openos-{iso_name}-{arch}-{kernel_key}-{build_id}.iso"
          iso_dir  = f"bins/iso/{build_id}"

          with open(os.environ.get('GITHUB_OUTPUT', ''), 'a') as f:
              f.write(f"iso_name={iso_name}\n")
              f.write(f"arch={arch}\n")
              f.write(f"kernel={kernel_key}\n")
              f.write(f"expire_date={expire}\n")
              f.write(f"expire_days={expire_days}\n")
              f.write(f"build_id={build_id}\n")
              f.write(f"iso_file={iso_file}\n")
              f.write(f"iso_dir={iso_dir}\n")
              f.write(f"pacman_pkgs={' '.join(pacman_pkgs)}\n")
          PYEOF
        env:
          BODY: ${{ github.event.issue.body }}

      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            zstd xorriso isolinux grub-pc-bin grub-common \
            mtools squashfs-tools

      - name: 拉取各组件最新 binpkg
        run: |
          cd OPENOS_CORE/BUILD_SYSTEM
          chmod +x fetch_binpkgs.sh build_image.sh
          ./fetch_binpkgs.sh --arch=${{ steps.parse.outputs.arch }} --kernel=${{ steps.parse.outputs.kernel }}

      - name: 组装基础 rootfs
        run: |
          cd OPENOS_CORE/BUILD_SYSTEM
          ./build_image.sh --arch=${{ steps.parse.outputs.arch }} \
            --kernel=${{ steps.parse.outputs.kernel }} \
            --out=${{ steps.parse.outputs.build_id }}

      - name: 安装额外 Pacman 包到 rootfs（含自动依赖处理）
        if: ${{ steps.parse.outputs.pacman_pkgs != '' }}
        run: |
          set -euo pipefail
          ARCH=${{ steps.parse.outputs.arch }}
          KERNEL=${{ steps.parse.outputs.kernel }}
          BUILD_ID=${{ steps.parse.outputs.build_id }}
          PACMAN_PKGS="${{ steps.parse.outputs.pacman_pkgs }}"
          IMAGE_DIR="OPENOS_CORE/BUILD_SYSTEM/out/images"
          ROOTFS_ARCHIVE="$IMAGE_DIR/${ARCH}-${KERNEL}-${BUILD_ID}.tar.zst"
          ROOTFS_DIR="$RUNNER_TEMP/rootfs-pacman"

          echo "额外 Pacman 包: $PACMAN_PKGS"
          echo "目标架构: $ARCH"

          # 映射架构名到 qemu 架构名
          case "$ARCH" in
            x86-64)  QEMU_BIN="" ;;
            x86)     QEMU_BIN=qemu-i386-static ;;
            arm64)   QEMU_BIN=qemu-aarch64-static ;;
            arm32)   QEMU_BIN=qemu-arm-static ;;
            loong64) QEMU_BIN="" ;;
          esac

          rm -rf "$ROOTFS_DIR"
          mkdir -p "$ROOTFS_DIR"
          tar --zstd -xf "$ROOTFS_ARCHIVE" -C "$ROOTFS_DIR"

          # 跨架构 chroot 需要 qemu-user-static
          if [ -n "${QEMU_BIN:-}" ]; then
            sudo apt-get install -y -qq qemu-user-static
            sudo cp "/usr/bin/$QEMU_BIN" "$ROOTFS_DIR/usr/bin/" || true
          fi

          # 复制 DNS 配置
          sudo cp /etc/resolv.conf "$ROOTFS_DIR/etc/resolv.conf"

          # 挂载必要文件系统
          sudo mount --bind /dev "$ROOTFS_DIR/dev"
          sudo mount --bind /proc "$ROOTFS_DIR/proc"
          sudo mount --bind /sys "$ROOTFS_DIR/sys"

          # 安装额外包
          echo "正在安装额外 Pacman 包..."
          sudo chroot "$ROOTFS_DIR" /bin/bash -c "
            pacman -Sy --noconfirm $PACMAN_PKGS
            pacman -Scc --noconfirm
          " || {
            echo "::warning::Pacman 包安装失败，部分包可能不可用"
          }

          # 清理
          sudo umount "$ROOTFS_DIR/dev" "$ROOTFS_DIR/proc" "$ROOTFS_DIR/sys" 2>/dev/null || true
          sudo rm -f "$ROOTFS_DIR/etc/resolv.conf"
          if [ -n "${QEMU_BIN:-}" ]; then
            sudo rm -f "$ROOTFS_DIR/usr/bin/$QEMU_BIN"
          fi

          # 重新打包 rootfs
          cd "$ROOTFS_DIR"
          sudo tar --zstd -cf "$ROOTFS_ARCHIVE" .
          sudo rm -rf "$ROOTFS_DIR"
          echo "额外 Pacman 包安装完成，rootfs 已更新"

      - name: 构建可启动 ISO
        run: |
          ARCH=${{ steps.parse.outputs.arch }}
          KERNEL=${{ steps.parse.outputs.kernel }}
          BUILD_ID=${{ steps.parse.outputs.build_id }}
          ISO_FILE=${{ steps.parse.outputs.iso_file }}
          IMAGE_DIR="OPENOS_CORE/BUILD_SYSTEM/out/images"
          STAGE="$RUNNER_TEMP/iso-stage"
          ROOTFS_ARCHIVE="$IMAGE_DIR/${ARCH}-${KERNEL}-${BUILD_ID}.tar.zst"

          mkdir -p "$STAGE/iso-root" "$STAGE/iso-out"
          tar --zstd -xf "$ROOTFS_ARCHIVE" -C "$STAGE/iso-root"
          sudo mksquashfs "$STAGE/iso-root" "$STAGE/iso-out/filesystem.squashfs" \
            -comp zstd -b 1M -no-exports -no-recovery

          ISO_DIR="$STAGE/iso-dir"
          mkdir -p "$ISO_DIR/boot/grub" "$ISO_DIR/live"
          cp "$STAGE/iso-root/boot/vmlinuz"* "$ISO_DIR/boot/vmlinuz" 2>/dev/null || true
          cp "$STAGE/iso-root/boot/initrd"* "$ISO_DIR/boot/initrd" 2>/dev/null || true
          mv "$STAGE/iso-out/filesystem.squashfs" "$ISO_DIR/live/"

          cat > "$ISO_DIR/boot/grub/grub.cfg" <<'GRUBEOF'
set timeout=5
set default=0
menuentry "OPENOS Live" {
  linux /boot/vmlinuz boot=live toram findiso=/live/filesystem.squashfs quiet splash
  initrd /boot/initrd
}
GRUBEOF

          sudo grub-mkrescue -o "$IMAGE_DIR/$ISO_FILE" "$ISO_DIR" 2>/dev/null || \
          xorriso -as mkisofs -iso-level 3 -full-iso9660-filenames \
            -volid "OPENOS_LIVE" -output "$IMAGE_DIR/$ISO_FILE" "$ISO_DIR"

          ls -lah "$IMAGE_DIR/$ISO_FILE"

      - name: 推送到共享 binpkg 仓库
        env:
          BINPKG_TOKEN: ${{ secrets.OPENOS_BINPKG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BINPKG_TOKEN" ]; then
            echo "::warning::未配置 secrets.OPENOS_BINPKG_TOKEN，跳过推送"
            echo "push_failed=true" >> "$GITHUB_ENV"
            exit 0
          fi

          ARCH=${{ steps.parse.outputs.arch }}
          BUILD_ID=${{ steps.parse.outputs.build_id }}
          ISO_FILE=${{ steps.parse.outputs.iso_file }}
          ISO_DIR=${{ steps.parse.outputs.iso_dir }}
          EXPIRE_DATE=${{ steps.parse.outputs.expire_date }}
          ISO_NAME=${{ steps.parse.outputs.iso_name }}
          IMAGE_DIR="OPENOS_CORE/BUILD_SYSTEM/out/images"

          rm -rf /tmp/binpkg-repo
          git clone --depth 1 \
            "https://x-access-token:${BINPKG_TOKEN}@github.com/${BINPKG_REPO}.git" \
            /tmp/binpkg-repo

          cd /tmp/binpkg-repo
          mkdir -p "$ISO_DIR"
          cp "$IMAGE_DIR/$ISO_FILE" "$ISO_DIR/"

          cat > "$ISO_DIR/META.json" <<METAEOF
          {
            "build_id": "${BUILD_ID}",
            "iso_name": "${ISO_NAME}",
            "arch": "${ARCH}",
            "kernel": "${{ steps.parse.outputs.kernel }}",
            "expire_date": "${EXPIRE_DATE}",
            "source_issue": ${{ github.event.issue.number }},
            "source_repo": "${GITHUB_REPOSITORY}",
            "build_run": "${GITHUB_RUN_ID}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
METAEOF

          git config user.name "OPENOS CI"
          git config user.email "ci@openos.dev"
          git add -A
          git commit -m "iso: ${ISO_NAME} ${ARCH} (${BUILD_ID})" || echo "no changes"
          git push -q origin main
          echo "ISO 已推送到共享仓库"
          echo "push_failed=false" >> "$GITHUB_ENV"

      - name: 在 Issue 中回复构建结果
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCH=${{ steps.parse.outputs.arch }}
          KERNEL=${{ steps.parse.outputs.kernel }}
          BUILD_ID=${{ steps.parse.outputs.build_id }}
          ISO_NAME=${{ steps.parse.outputs.iso_name }}
          EXPIRE_DATE=${{ steps.parse.outputs.expire_date }}
          EXPIRE_DAYS=${{ steps.parse.outputs.expire_days }}
          ISO_FILE=${{ steps.parse.outputs.iso_file }}
          ISO_DIR=${{ steps.parse.outputs.iso_dir }}

          if [ "${push_failed:-true}" = "false" ]; then
            DL_URL="https://github.com/${BINPKG_REPO}/raw/main/${ISO_DIR}/${ISO_FILE}"
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "## OPENOS ISO 构建完成

| 项目 | 值 |
|------|-----|
| 镜像名称 | ${ISO_NAME} |
| 架构 | ${ARCH} |
| 内核 | ${KERNEL} |
| 构建 ID | ${BUILD_ID} |
| 过期日期 | ${EXPIRE_DATE} |

**下载链接**: [${ISO_FILE}](${DL_URL})

> 此文件将在 ${EXPIRE_DAYS} 天后（${EXPIRE_DATE}）自动从仓库删除。
> 如需重新构建，请提交新的 Issue。"
          else
            DL_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "## OPENOS ISO 构建完成

| 项目 | 值 |
|------|-----|
| 镜像名称 | ${ISO_NAME} |
| 架构 | ${ARCH} |
| 内核 | ${KERNEL} |
| 构建 ID | ${BUILD_ID} |
| 过期日期 | ${EXPIRE_DATE} |

**镜像已保存至 Actions 构建产物**（推送共享仓库失败），需登录 GitHub 后下载。

下载方式：
1. 打开此构建运行页面：[${GITHUB_RUN_ID}](${DL_URL})
2. 在 **Artifacts** 区域找到 \`${ISO_FILE}\` 点击下载

> 此产物将在 ${EXPIRE_DAYS} 天后自动过期。"
          fi

          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label "building-iso" \
            --add-label "iso-built" || true

      - name: 上传 ISO 到 Actions Artifact（备选）
        if: env.push_failed == 'true' || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.parse.outputs.iso_file }}
          path: OPENOS_CORE/BUILD_SYSTEM/out/images/${{ steps.parse.outputs.iso_file }}
          retention-days: ${{ steps.parse.outputs.expire_days }}
          if-no-files-found: error

      - name: 构建失败时通知并创建失败追踪 Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCH=${{ steps.parse.outputs.arch }}
          KERNEL=${{ steps.parse.outputs.kernel }}
          BUILD_ID=${{ steps.parse.outputs.build_id }}
          ISO_NAME=${{ steps.parse.outputs.iso_name }}

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "## 构建失败

很抱歉，ISO 构建过程中出现错误。请检查构建日志了解更多信息。

[查看构建日志](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

可能的原因：
- 某个组件当前不可用（binpkg 缺失）
- 构建环境依赖问题
- 请求的参数不合法

请修正后重新提交 Issue。" || true

          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label "building-iso" \
            --add-label "iso-failed" || true

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[ISO-BUILD-FAIL] ${ISO_NAME} (${ARCH}/${KERNEL})" \
            --label "iso-failure" \
            --label "bug" \
            --body "## ISO 构建失败报告

此 Issue 由自定义 ISO 构建流水线自动创建，用于追踪构建失败原因。

| 项目 | 值 |
|------|-----|
| 镜像名称 | ${ISO_NAME} |
| 架构 | ${ARCH} |
| 内核 | ${KERNEL} |
| 构建 ID | ${BUILD_ID} |
| 源 Issue | [#${ISSUE_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}) |
| 构建日志 | [查看](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |

### 失败原因

请维护者检查构建日志，确定失败原因并修复。

### 用户操作

用户可以修正参数后重新提交 [新的 ISO 构建请求](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/new?template=custom-iso-build.yml)。" || true