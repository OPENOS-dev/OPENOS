name: OPENOS Build

# 主系统构建: 不再本地构建组件, 而是从共享 binpkg 仓库
# (OPENOS-BUILD-BINPKG) 拉取各子模块 CI 产出的最新 .pkg.tar.zst, 组装镜像。
#
# 组件构建由各子模块自己的 GitHub Actions 完成:
#   - 子模块 push -> 构建 -> 推送 binpkg 到 OPENOS-BUILD-BINPKG bins/<组件>/<架构>/

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      kernel:
        description: 内核分层
        type: choice
        default: base
        options: [base, base7, preview, classic]

jobs:
  build:
    name: assemble-${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64, x86, arm64, arm32, loong64]

    env:
      ARCH: ${{ matrix.arch }}
      OPENOS_ARCH: ${{ matrix.arch }}
      KERNEL_TIER: ${{ inputs.kernel || 'base' }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装组装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd git pacman archlinux-keyring

      - name: 拉取各组件最新 binpkg
        run: |
          cd OPENOS_CORE/BUILD_SYSTEM
          chmod +x fetch_binpkgs.sh build_image.sh
          ./fetch_binpkgs.sh --arch=${{ env.ARCH }} --kernel=${{ env.KERNEL_TIER }}

      - name: 组装镜像
        run: |
          cd OPENOS_CORE/BUILD_SYSTEM
          ./build_image.sh --arch=${{ env.ARCH }} --kernel=${{ env.KERNEL_TIER }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: openos-${{ matrix.arch }}-${{ env.KERNEL_TIER }}
          path: OPENOS_CORE/BUILD_SYSTEM/out/images/
          if-no-files-found: warn
