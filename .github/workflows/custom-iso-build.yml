name: OPENOS Custom ISO Build

# 用户通过 Issue 模板提交自定义 ISO 构建请求后，此工作流自动执行。
# 构建产物推送到共享 binpkg 仓库 (OPENOS-BUILD-BINPKG)，
# 提供原始文件下载链接，过期后由 iso-cleanup 工作流自动删除。

on:
  issues:
    types: [opened, labeled]

jobs:
  validate-and-build:
    # 仅当 Issue 带有 custom-iso-build 标签且标题以 [ISO-BUILD] 开头时执行
    if: |
      contains(github.event.issue.labels.*.name, 'custom-iso-build') &&
      startsWith(github.event.issue.title, '[ISO-BUILD]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      issues: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      BINPKG_REPO: OPENOS-dev/OPENOS-BUILD-BINPKG

    outputs:
      iso_name: ${{ steps.parse.outputs.iso_name }}
      arch: ${{ steps.parse.outputs.arch }}
      kernel: ${{ steps.parse.outputs.kernel }}
      expire_date: ${{ steps.parse.outputs.expire_date }}
      expire_days: ${{ steps.parse.outputs.expire_days }}
      build_id: ${{ steps.parse.outputs.build_id }}
      iso_file: ${{ steps.parse.outputs.iso_file }}
      iso_dir: ${{ steps.parse.outputs.iso_dir }}
      comp_set: ${{ steps.parse.outputs.comp_set }}

    steps:
      - name: 添加构建中标签并回复准备通知
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --add-label "building-iso" || true
          BODY=$'## 正在准备构建 / Preparing Build\n\n收到您的 ISO 构建请求，正在准备中，请稍候...\nYour ISO build request has been received. Preparing, please wait...\n\n- 构建参数解析中 / Parsing build parameters...\n- 依赖组件拉取中 / Fetching dependencies...\n- 预计构建时间：2-5 分钟 / Estimated build time: 2-5 minutes\n\n构建完成后会在此通知您。\nYou will be notified here once the build is complete.'
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$BODY" || true

      - name: 解析 Issue 体提取构建参数
        id: parse
        run: |
          echo 'BODY_START' > /tmp/issue-body.txt
          cat << 'BODYEOF' >> /tmp/issue-body.txt
          ${{ toJSON(github.event.issue.body) }}
          BODYEOF
          echo 'BODY_END' >> /tmp/issue-body.txt

          python3 <<'PYEOF'
          import re, hashlib, json, os

          with open('/tmp/issue-body.txt') as f:
              text = f.read()
          m = re.search(r'BODY_START\s*\n(.*)\n\s*BODY_END', text, re.DOTALL)
          body_raw = m.group(1).strip() if m else ''
          if body_raw.startswith('"') and body_raw.endswith('"'):
              body_raw = body_raw[1:-1]
          body = body_raw.replace('\\n', '\n').replace('\\t', '\t').replace('\\"', '"')

          def get_field(pattern, text, default=''):
              m = re.search(pattern, text, re.MULTILINE | re.DOTALL)
              return m.group(1).strip() if m else default

          def get_field_bilingual(zh_pattern, en_pattern, text, default=''):
              # 先尝试中文匹配，再尝试英文匹配
              m = re.search(zh_pattern, text, re.MULTILINE | re.DOTALL)
              if m:
                  return m.group(1).strip()
              m = re.search(en_pattern, text, re.MULTILINE | re.DOTALL)
              return m.group(1).strip() if m else default

          iso_name  = get_field_bilingual(
              r'### 镜像名称 / Image Name\s*\n\s*([^\n]+)',
              r'### 镜像名称 / Image Name\s*\n\s*([^\n]+)',
              body, 'custom')
          arch      = get_field_bilingual(
              r'### 目标架构 / Target Architecture\s*\n\s*([^\n]+)',
              r'### 目标架构 / Target Architecture\s*\n\s*([^\n]+)',
              body, 'x86-64')
          kernel    = get_field_bilingual(
              r'### 内核分层 / Kernel Tier\s*\n\s*([^\n]+)',
              r'### 内核分层 / Kernel Tier\s*\n\s*([^\n]+)',
              body, 'base')
          comp_set  = get_field_bilingual(
              r'### 组件集合 / Component Set\s*\n\s*([^\n]+)',
              r'### 组件集合 / Component Set\s*\n\s*([^\n]+)',
              body, '基础包')
          custom_raw = get_field_bilingual(
              r'### 自定义额外包列表（仅选择"自定义"时填写） / Custom Package List \(Custom Only\)\s*\n\s*([^#]*)',
              r'### 自定义额外包列表（仅选择"自定义"时填写） / Custom Package List \(Custom Only\)\s*\n\s*([^#]*)',
              body, '')
          extra_raw = get_field_bilingual(
              r'### 额外追加包列表（可选，适用于所有模式） / Extra Packages \(Optional, All Modes\)\s*\n\s*([^#]*)',
              r'### 额外追加包列表（可选，适用于所有模式） / Extra Packages \(Optional, All Modes\)\s*\n\s*([^#]*)',
              body, '')
          expire_days = get_field_bilingual(
              r'### 下载过期时间（天） / Download Expiry \(Days\)\s*\n\s*([^\n]+)',
              r'### 下载过期时间（天） / Download Expiry \(Days\)\s*\n\s*([^\n]+)',
              body, '30')

          iso_name = re.sub(r'[^a-zA-Z0-9_-]', '_', iso_name)[:40]
          expire_days = re.sub(r'[^0-9]', '', expire_days)
          if not expire_days or int(expire_days) <= 0: expire_days = '30'
          if int(expire_days) > 90: expire_days = '90'

          kernel_key = kernel.split()[0].lower()

          # 组件集合 → 包列表映射
          def parse_pkg_list(text):
              pkgs = []
              if text.strip():
                  for line in text.strip().split('\n'):
                      pkg = line.strip()
                      if pkg and not pkg.startswith('#'):
                          pkgs.append(pkg)
              return pkgs

          # 基础包 (日常软件)
          BASE_APPS = "blender libreoffice-fresh"
          # 完整包 (开发工具)
          DEV_TOOLS = "code qemu nodejs docker"

          # 根据组件集合计算最终包列表
          custom_pkgs = parse_pkg_list(custom_raw)
          extra_pkgs  = parse_pkg_list(extra_raw)

          comp_key = comp_set.split()[0]  # 基础包 / Basic / 普通包 / Regular / 完整包 / Full / 自定义 / Custom
          if comp_key in ('基础包', 'Basic'):
              all_pkgs = extra_pkgs
          elif comp_key in ('普通包', 'Regular'):
              all_pkgs = parse_pkg_list(BASE_APPS) + extra_pkgs
          elif comp_key in ('完整包', 'Full'):
              all_pkgs = parse_pkg_list(BASE_APPS) + parse_pkg_list(DEV_TOOLS) + extra_pkgs
          elif comp_key in ('自定义', 'Custom'):
              all_pkgs = custom_pkgs + extra_pkgs
          else:
              all_pkgs = extra_pkgs

          raw = f"{iso_name}-{arch}-{kernel_key}-{os.environ.get('ISSUE_NUMBER', '0')}"
          build_id = hashlib.sha256(raw.encode()).hexdigest()[:12]

          from datetime import datetime, timedelta
          expire = (datetime.utcnow() + timedelta(days=int(expire_days))).strftime('%Y-%m-%d')

          iso_file = f"openos-{iso_name}-{arch}-{kernel_key}-{build_id}.iso"
          iso_dir  = f"bins/iso/{build_id}"

          with open(os.environ.get('GITHUB_OUTPUT', ''), 'a') as f:
              f.write(f"iso_name={iso_name}\n")
              f.write(f"arch={arch}\n")
              f.write(f"kernel={kernel_key}\n")
              f.write(f"expire_date={expire}\n")
              f.write(f"expire_days={expire_days}\n")
              f.write(f"build_id={build_id}\n")
              f.write(f"iso_file={iso_file}\n")
              f.write(f"iso_dir={iso_dir}\n")
              f.write(f"pacman_pkgs={' '.join(all_pkgs)}\n")
              f.write(f"comp_set={comp_key}\n")
          PYEOF
        env:
          BODY: ${{ github.event.issue.body }}

      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            zstd xorriso isolinux grub-pc-bin grub-common \
            mtools squashfs-tools

      - name: 拉取各组件最新 binpkg
        run: |
          cd OPENOS_CORE/BUILD_SYSTEM
          chmod +x fetch_binpkgs.sh build_image.sh
          ./fetch_binpkgs.sh --arch=${{ steps.parse.outputs.arch }} --kernel=${{ steps.parse.outputs.kernel }}

      - name: 组装基础 rootfs
        run: |
          cd OPENOS_CORE/BUILD_SYSTEM
          ./build_image.sh --arch=${{ steps.parse.outputs.arch }} \
            --kernel=${{ steps.parse.outputs.kernel }} \
            --out=${{ steps.parse.outputs.build_id }}

      - name: 安装额外 Pacman 包到 rootfs（含自动依赖处理）
        if: ${{ steps.parse.outputs.pacman_pkgs != '' }}
        run: |
          set -euo pipefail
          ARCH=${{ steps.parse.outputs.arch }}
          KERNEL=${{ steps.parse.outputs.kernel }}
          BUILD_ID=${{ steps.parse.outputs.build_id }}
          PACMAN_PKGS="${{ steps.parse.outputs.pacman_pkgs }}"
          IMAGE_DIR="OPENOS_CORE/BUILD_SYSTEM/out/images"
          ROOTFS_ARCHIVE="$IMAGE_DIR/${ARCH}-${KERNEL}-${BUILD_ID}.tar.zst"
          ROOTFS_DIR="$RUNNER_TEMP/rootfs-pacman"

          echo "额外 Pacman 包: $PACMAN_PKGS"
          echo "目标架构: $ARCH"

          # 映射架构名到 qemu 架构名
          case "$ARCH" in
            x86-64)  QEMU_BIN="" ;;
            x86)     QEMU_BIN=qemu-i386-static ;;
            arm64)   QEMU_BIN=qemu-aarch64-static ;;
            arm32)   QEMU_BIN=qemu-arm-static ;;
            loong64) QEMU_BIN="" ;;
          esac

          rm -rf "$ROOTFS_DIR"
          mkdir -p "$ROOTFS_DIR"
          tar --zstd -xf "$ROOTFS_ARCHIVE" -C "$ROOTFS_DIR"

          # 跨架构 chroot 需要 qemu-user-static
          if [ -n "${QEMU_BIN:-}" ]; then
            sudo apt-get install -y -qq qemu-user-static
            sudo cp "/usr/bin/$QEMU_BIN" "$ROOTFS_DIR/usr/bin/" || true
          fi

          # 复制 DNS 配置
          sudo cp /etc/resolv.conf "$ROOTFS_DIR/etc/resolv.conf"

          # 挂载必要文件系统
          sudo mount --bind /dev "$ROOTFS_DIR/dev"
          sudo mount --bind /proc "$ROOTFS_DIR/proc"
          sudo mount --bind /sys "$ROOTFS_DIR/sys"

          # 安装额外包
          echo "正在安装额外 Pacman 包..."
          sudo chroot "$ROOTFS_DIR" /bin/bash -c "
            pacman -Sy --noconfirm $PACMAN_PKGS
            pacman -Scc --noconfirm
          " || {
            echo "::warning::Pacman 包安装失败，部分包可能不可用"
          }

          # 清理
          sudo umount "$ROOTFS_DIR/dev" "$ROOTFS_DIR/proc" "$ROOTFS_DIR/sys" 2>/dev/null || true
          sudo rm -f "$ROOTFS_DIR/etc/resolv.conf"
          if [ -n "${QEMU_BIN:-}" ]; then
            sudo rm -f "$ROOTFS_DIR/usr/bin/$QEMU_BIN"
          fi

          # 重新打包 rootfs
          cd "$ROOTFS_DIR"
          sudo tar --zstd -cf "$ROOTFS_ARCHIVE" .
          sudo rm -rf "$ROOTFS_DIR"
          echo "额外 Pacman 包安装完成，rootfs 已更新"

      - name: 构建可启动 ISO
        run: |
          ARCH=${{ steps.parse.outputs.arch }}
          KERNEL=${{ steps.parse.outputs.kernel }}
          BUILD_ID=${{ steps.parse.outputs.build_id }}
          ISO_FILE=${{ steps.parse.outputs.iso_file }}
          IMAGE_DIR="OPENOS_CORE/BUILD_SYSTEM/out/images"
          STAGE="$RUNNER_TEMP/iso-stage"
          ROOTFS_ARCHIVE="$IMAGE_DIR/${ARCH}-${KERNEL}-${BUILD_ID}.tar.zst"

          mkdir -p "$STAGE/iso-root" "$STAGE/iso-out"
          tar --zstd -xf "$ROOTFS_ARCHIVE" -C "$STAGE/iso-root"
          sudo mksquashfs "$STAGE/iso-root" "$STAGE/iso-out/filesystem.squashfs" \
            -comp zstd -b 1M -no-exports -no-recovery

          ISO_DIR="$STAGE/iso-dir"
          mkdir -p "$ISO_DIR/boot/grub" "$ISO_DIR/live"

          # 查找内核文件（架构相关）
          KERNEL_SRC=""
          for k in vmlinuz-linux vmlinuz Image Image.gz zImage; do
            found=$(find "$STAGE/iso-root/boot" -name "$k*" -type f 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              KERNEL_SRC="$found"
              break
            fi
          done
          if [ -z "$KERNEL_SRC" ]; then
            echo "::error::未找到内核文件 kernel file not found in /boot/"
            ls -la "$STAGE/iso-root/boot/" 2>/dev/null || true
            exit 1
          fi
          echo "找到内核 / Found kernel: $KERNEL_SRC"
          cp "$KERNEL_SRC" "$ISO_DIR/boot/vmlinuz"

          # 查找 initrd 文件
          INITRD_SRC=""
          for i in initramfs-linux.img initrd-linux.img initramfs.img initrd.img; do
            found=$(find "$STAGE/iso-root/boot" -name "$i*" -type f 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              INITRD_SRC="$found"
              break
            fi
          done
          if [ -z "$INITRD_SRC" ]; then
            echo "::warning::未找到 initrd 文件 initrd not found in /boot/"
          else
            echo "找到 initrd / Found initrd: $INITRD_SRC"
            cp "$INITRD_SRC" "$ISO_DIR/boot/initrd"
          fi
          mv "$STAGE/iso-out/filesystem.squashfs" "$ISO_DIR/live/"

          {
            echo 'set timeout=5'
            echo 'set default=0'
            echo 'menuentry "OPENOS Live" {'
            echo '  linux /boot/vmlinuz boot=live toram findiso=/live/filesystem.squashfs quiet splash'
            echo '  initrd /boot/initrd'
            echo '}'
          } > "$ISO_DIR/boot/grub/grub.cfg"

          # 安装架构相关 GRUB EFI 包并创建可启动 ISO
          case "$ARCH" in
            x86-64)
              GRUB_TARGET="x86_64-efi"
              ;;
            x86)
              GRUB_TARGET="i386-efi"
              sudo apt-get install -y -qq grub-efi-ia32-bin 2>/dev/null || true
              ;;
            arm64)
              GRUB_TARGET="arm64-efi"
              sudo apt-get install -y -qq grub-efi-arm64-bin 2>/dev/null || true
              ;;
            arm32)
              GRUB_TARGET="arm-efi"
              sudo apt-get install -y -qq grub-efi-arm-bin 2>/dev/null || true
              ;;
            loong64)
              GRUB_TARGET="loong64-efi"
              # Debian sid 提供 loong64 GRUB 包，Ubuntu 暂不支持
              GRUB_PKG_URL="http://ftp.debian.org/debian/pool/main/g/grub2/grub-efi-loong64-bin_2.14-3_loong64.deb"
              GRUB_PKG_OUT="/tmp/grub-loong64.deb"
              GRUB_MOD_DIR="/usr/lib/grub/loong64-efi"
              if [ ! -d "$GRUB_MOD_DIR" ]; then
                echo "从 Debian sid 下载 grub-efi-loong64-bin..."
                wget -q "$GRUB_PKG_URL" -O "$GRUB_PKG_OUT" || {
                  echo "::warning::下载 loong64 GRUB 包失败，将使用 xorriso 创建无引导 ISO"
                  GRUB_TARGET=""
                }
                if [ -n "$GRUB_TARGET" ] && [ -f "$GRUB_PKG_OUT" ]; then
                  mkdir -p /tmp/grub-extract
                  dpkg-deb -x "$GRUB_PKG_OUT" /tmp/grub-extract
                  if [ -d "/tmp/grub-extract/usr/lib/grub/loong64-efi" ]; then
                    sudo mkdir -p "$GRUB_MOD_DIR"
                    sudo cp -r /tmp/grub-extract/usr/lib/grub/loong64-efi/* "$GRUB_MOD_DIR/"
                    echo "loong64 GRUB 模块已安装到 $GRUB_MOD_DIR"
                  else
                    echo "::warning::未找到 loong64 GRUB 模块，将使用 xorriso 创建无引导 ISO"
                    GRUB_TARGET=""
                  fi
                  rm -rf /tmp/grub-extract "$GRUB_PKG_OUT"
                fi
              fi
              ;;
          esac

          if command -v grub-mkrescue &>/dev/null && [ -n "$GRUB_TARGET" ]; then
            sudo grub-mkrescue --target="$GRUB_TARGET" -o "$IMAGE_DIR/$ISO_FILE" "$ISO_DIR"
          else
            xorriso -as mkisofs -iso-level 3 -full-iso9660-filenames \
              -volid "OPENOS_LIVE" -output "$IMAGE_DIR/$ISO_FILE" "$ISO_DIR"
          fi

          ls -lah "$IMAGE_DIR/$ISO_FILE"

      - name: 推送到共享 binpkg 仓库
        env:
          BINPKG_TOKEN: ${{ secrets.OPENOS_BINPKG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BINPKG_TOKEN" ]; then
            echo "::warning::未配置 secrets.OPENOS_BINPKG_TOKEN，跳过推送"
            echo "push_failed=true" >> "$GITHUB_ENV"
            exit 0
          fi

          ARCH=${{ steps.parse.outputs.arch }}
          BUILD_ID=${{ steps.parse.outputs.build_id }}
          ISO_FILE=${{ steps.parse.outputs.iso_file }}
          ISO_DIR=${{ steps.parse.outputs.iso_dir }}
          EXPIRE_DATE=${{ steps.parse.outputs.expire_date }}
          ISO_NAME=${{ steps.parse.outputs.iso_name }}
          IMAGE_DIR="OPENOS_CORE/BUILD_SYSTEM/out/images"

          rm -rf /tmp/binpkg-repo
          git clone --depth 1 \
            "https://x-access-token:${BINPKG_TOKEN}@github.com/${BINPKG_REPO}.git" \
            /tmp/binpkg-repo

          cd /tmp/binpkg-repo
          mkdir -p "$ISO_DIR"
          cp "$IMAGE_DIR/$ISO_FILE" "$ISO_DIR/"

          printf '{\n  "build_id": "%s",\n  "iso_name": "%s",\n  "arch": "%s",\n  "kernel": "%s",\n  "comp_set": "%s",\n  "expire_date": "%s",\n  "source_issue": %s,\n  "source_repo": "%s",\n  "build_run": "%s",\n  "created_at": "%s"\n}\n' \
            "${BUILD_ID}" \
            "${ISO_NAME}" \
            "${ARCH}" \
            "${{ steps.parse.outputs.kernel }}" \
            "${{ steps.parse.outputs.comp_set }}" \
            "${EXPIRE_DATE}" \
            "${{ github.event.issue.number }}" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_RUN_ID}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$ISO_DIR/META.json"

          git config user.name "OPENOS CI"
          git config user.email "ci@openos.dev"
          git add -A
          git commit -m "iso: ${ISO_NAME} ${ARCH} (${BUILD_ID})" || echo "no changes"
          git push -q origin main
          echo "ISO 已推送到共享仓库"
          echo "push_failed=false" >> "$GITHUB_ENV"

      - name: 在 Issue 中回复构建结果
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCH=${{ steps.parse.outputs.arch }}
          KERNEL=${{ steps.parse.outputs.kernel }}
          BUILD_ID=${{ steps.parse.outputs.build_id }}
          ISO_NAME=${{ steps.parse.outputs.iso_name }}
          EXPIRE_DATE=${{ steps.parse.outputs.expire_date }}
          EXPIRE_DAYS=${{ steps.parse.outputs.expire_days }}
          ISO_FILE=${{ steps.parse.outputs.iso_file }}
          ISO_DIR=${{ steps.parse.outputs.iso_dir }}

          if [ "${push_failed:-true}" = "false" ]; then
            DL_URL="https://github.com/${BINPKG_REPO}/raw/main/${ISO_DIR}/${ISO_FILE}"
            BODY=$(printf "## OPENOS ISO 构建完成 / Build Complete\n\n| 项目 / Item | 值 / Value |\n|------|-----|\n| 镜像名称 / Image Name | ${ISO_NAME} |\n| 架构 / Architecture | ${ARCH} |\n| 内核 / Kernel | ${KERNEL} |\n| 组件集合 / Component Set | ${{ steps.parse.outputs.comp_set }} |\n| 构建 ID / Build ID | ${BUILD_ID} |\n| 过期日期 / Expiry Date | ${EXPIRE_DATE} |\n\n**下载链接 / Download Link**: [${ISO_FILE}](${DL_URL})\n\n> 此文件将在 ${EXPIRE_DAYS} 天后（${EXPIRE_DATE}）自动失效。\n> This file will expire in ${EXPIRE_DAYS} days (${EXPIRE_DATE}).\n\n---\n\n**请回复 / Please reply**：\n此镜像是否满足您的需求？请回复 **是** 关闭此 Issue，或回复 **否** 告诉我们有什么问题。\nDoes this image meet your needs? Reply **yes** to close this issue, or **no** to tell us what's wrong.")
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$BODY"
          else
            DL_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            BODY=$(printf "## OPENOS ISO 构建完成 / Build Complete\n\n| 项目 / Item | 值 / Value |\n|------|-----|\n| 镜像名称 / Image Name | ${ISO_NAME} |\n| 架构 / Architecture | ${ARCH} |\n| 内核 / Kernel | ${KERNEL} |\n| 组件集合 / Component Set | ${{ steps.parse.outputs.comp_set }} |\n| 构建 ID / Build ID | ${BUILD_ID} |\n| 过期日期 / Expiry Date | ${EXPIRE_DATE} |\n\n**镜像已保存至 Actions 构建产物**（推送共享仓库失败），需登录 GitHub 后下载。\n**Image saved as Actions artifact** (push to shared repo failed). Please log in to GitHub to download.\n\n下载方式 / Download steps：\n1. 打开此构建运行页面 / Open this build run: [${GITHUB_RUN_ID}](${DL_URL})\n2. 在 **Artifacts** 区域找到 \`${ISO_FILE}\` 点击下载 / Find \`${ISO_FILE}\` in the **Artifacts** section and click to download\n\n> 此产物将在 ${EXPIRE_DAYS} 天后自动过期。\n> This artifact will expire in ${EXPIRE_DAYS} days.\n\n---\n\n**请回复 / Please reply**：\n此镜像是否满足您的需求？请回复 **是** 关闭此 Issue，或回复 **否** 告诉我们有什么问题。\nDoes this image meet your needs? Reply **yes** to close this issue, or **no** to tell us what's wrong.")
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$BODY"
          fi

          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label "building-iso" \
            --add-label "iso-built" || true

      - name: 上传 ISO 到 Actions Artifact（备选）
        if: env.push_failed == 'true' || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.parse.outputs.iso_file }}
          path: OPENOS_CORE/BUILD_SYSTEM/out/images/${{ steps.parse.outputs.iso_file }}
          retention-days: ${{ steps.parse.outputs.expire_days }}
          if-no-files-found: error

      - name: 构建失败时通知并创建失败追踪 Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCH=${{ steps.parse.outputs.arch }}
          KERNEL=${{ steps.parse.outputs.kernel }}
          BUILD_ID=${{ steps.parse.outputs.build_id }}
          ISO_NAME=${{ steps.parse.outputs.iso_name }}

          BODY=$(printf "## 构建失败 / Build Failed\n\n很抱歉，ISO 构建过程中出现错误。请检查构建日志了解更多信息。\nSorry, an error occurred during the ISO build. Please check the build log for details.\n\n[查看构建日志 / View Build Log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})\n\n可能的原因 / Possible causes：\n- 某个组件当前不可用（binpkg 缺失）/ A component is currently unavailable (missing binpkg)\n- 构建环境依赖问题 / Build environment dependency issue\n- 请求的参数不合法 / Invalid request parameters\n\n请修正后重新提交 Issue。\nPlease correct and resubmit the Issue.")
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$BODY" || true

          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label "building-iso" \
            --add-label "iso-failed" || true

          BODY=$(printf "## ISO 构建失败报告 / ISO Build Failure Report\n\n此 Issue 由自定义 ISO 构建流水线自动创建，用于追踪构建失败原因。\nThis issue was automatically created by the custom ISO build pipeline to track the build failure.\n\n| 项目 / Item | 值 / Value |\n|------|-----|\n| 镜像名称 / Image Name | ${ISO_NAME} |\n| 架构 / Architecture | ${ARCH} |\n| 内核 / Kernel | ${KERNEL} |\n| 构建 ID / Build ID | ${BUILD_ID} |\n| 源 Issue / Source Issue | [#${ISSUE_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}) |\n| 构建日志 / Build Log | [查看 / View](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |\n\n### 失败原因 / Failure Reason\n\n请维护者检查构建日志，确定失败原因并修复。\nMaintainers should check the build log to determine the cause and fix it.\n\n### 用户操作 / User Action\n\n用户可以修正参数后重新提交 [新的 ISO 构建请求](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/new?template=custom-iso-build.yml)。\nUsers can correct the parameters and submit a [new ISO build request](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/new?template=custom-iso-build.yml)。")
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[ISO-BUILD-FAIL] ${ISO_NAME} (${ARCH}/${KERNEL})" \
            --label "iso-failure" \
            --label "bug" \
            --body "$BODY" || true