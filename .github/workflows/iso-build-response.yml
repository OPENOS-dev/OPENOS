name: ISO Build User Response

# 监听用户对 ISO 构建结果的回复:
#   - 回复"是"/"yes" → 关闭 Issue
#   - 回复"否"/"no" → 询问有什么问题

on:
  issue_comment:
    types: [created]

jobs:
  handle-response:
    # 仅当 Issue 有 iso-built 标签且评论不是机器人自己发出的
    if: |
      contains(github.event.issue.labels.*.name, 'iso-built') &&
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.user.id != github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      issues: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_BODY: ${{ github.event.comment.body }}

    steps:
      - name: 解析用户回复
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          COMMENT_LOWER=$(echo "$COMMENT" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')

          echo "用户回复: $COMMENT"
          echo "小写: $COMMENT_LOWER"

          # 匹配"是"或"yes"（包括各种变体）
          case "$COMMENT_LOWER" in
            *是*|*yes*|*y*)
              echo "action=close" >> "$GITHUB_OUTPUT"
              ;;
            *否*|*no*|*n*)
              echo "action=ask" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "action=unknown" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: 用户确认完成 - 关闭 Issue
        if: steps.parse.outputs.action == 'close'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "感谢您的确认！此 Issue 即将关闭。

如果您后续需要新的构建，欢迎随时提交新的 ISO 构建请求。"
          gh issue close "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "根据用户确认关闭" || true
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "iso-built" \
            --add-label "iso-closed" || true

      - name: 用户不满意 - 询问具体问题
        if: steps.parse.outputs.action == 'ask'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "iso-built" \
            --add-label "iso-needs-fix" || true
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "## 收到您的反馈

很抱歉镜像未能满足您的需求。请告诉我们具体遇到了什么问题？

例如：
- 镜像启动失败
- 缺少某个软件包
- 某个功能无法正常使用
- 其他问题

维护者会尽快查看并协助您。

---

如果您想重新提交构建请求，请点击 [新建 ISO 构建请求](${{ github.server_url }}/${{ github.repository }}/issues/new?template=custom-iso-build.yml)。" || true

      - name: 无法识别的回复 - 提示用户
        if: steps.parse.outputs.action == 'unknown'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "没有看懂您的回复，请回复 **是** 来关闭此 Issue，或回复 **否** 告诉我们有什么问题。" || true