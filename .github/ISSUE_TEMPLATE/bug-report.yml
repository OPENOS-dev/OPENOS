name: Bug 报告 / Bug Report
description: 提交错误或异常行为 / Report a bug or abnormal behavior
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug 报告 / Bug Report

        **中文：** 感谢您帮助改进 OPENOS！请尽可能详细地描述问题。

        **English:** Thank you for helping improve OPENOS! Please describe the problem in as much detail as possible.

  - type: input
    id: component
    attributes:
      label: 相关组件 / Related Component
      description: 问题发生在哪个组件？（如内核、桌面环境、某个 App、构建系统等） / Which component is affected? (e.g., kernel, desktop, app, build system)
      placeholder: "openos-terminal / OPENUI-desktop / 内核 / Kernel"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Problem Description
      description: 清晰描述遇到的问题是什么 / Clearly describe the issue you encountered
      placeholder: "当...时，出现了...的问题 / When..., the following issue occurred..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Steps to Reproduce
      description: 如何复现该问题 / How to reproduce the issue
      placeholder: |
        1. 打开... / Open...
        2. 点击... / Click...
        3. 看到错误... / See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为 / Expected Behavior
      description: 您期望的正确行为是什么 / What behavior did you expect?
      placeholder: "应该... / Should..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual Behavior
      description: 实际发生了什么 / What actually happened
      placeholder: "实际出现了... / Actually got..."

  - type: input
    id: version
    attributes:
      label: 版本信息 / Version Info
      description: 相关组件的版本号或提交哈希 / Version or commit hash of the affected component
      placeholder: "DEV2026.1 / commit abc1234"

  - type: textarea
    id: logs
    attributes:
      label: 相关日志/截图（可选） / Logs/Screenshots (Optional)
      description: 错误日志、dmesg 输出、截图等有助于定位问题的信息 / Error logs, dmesg output, screenshots, etc.
      placeholder: "粘贴日志或拖入截图... / Paste logs or drag screenshots..."
      render: shell